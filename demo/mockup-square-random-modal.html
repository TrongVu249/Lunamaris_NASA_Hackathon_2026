<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEMO — Ô vuông "Click here" mở cửa sổ ảnh + video ngẫu nhiên</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Fira Sans', sans-serif;
    color: #F8FAFC;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,0.6), transparent 60%),
      radial-gradient(2px 2px at 85% 65%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1200px 600px at 60% 40%, #24335c, #101830 70%);
  }

  .page-title {
    margin: 0;
    padding: 18px 16px 6px;
    text-align: center;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #F5D77A;
  }

  /* ===== Ô vuông thay cho avatar tròn (chỉ để test) ===== */
  .square-btn {
    position: fixed;
    top: 64px;
    left: 28px;
    z-index: 10;
    width: 120px;
    height: 120px;
    padding: 0;
    border: 3px dashed #F5B841;
    border-radius: 10px;
    background: rgba(245, 184, 65, 0.14);
    color: #F5D77A;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.8rem;
    line-height: 1.3;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .square-btn:hover, .square-btn:focus-visible {
    background: rgba(245, 184, 65, 0.28);
    transform: scale(1.05);
    outline: none;
  }
  .square-hint-top, .square-hint-bottom {
    position: fixed;
    left: 28px;
    z-index: 10;
    width: 120px;
    text-align: center;
    font-weight: 800;
    color: #F5D77A;
    pointer-events: none;
  }
  .square-hint-top { top: 34px; font-size: 0.95rem; }
  .square-hint-bottom { top: 192px; font-size: 0.85rem; line-height: 1.35; }

  /* ===== Cửa sổ nhỏ (mô phỏng modal trắng ở ảnh 2) ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(8, 10, 20, 0.55);
    display: grid;
    place-items: center;
    padding: 20px;
    animation: fade-in 0.16s ease both;
  }
  .modal-overlay[hidden] { display: none; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .modal-window {
    width: min(640px, 100%);
    max-height: min(86vh, 760px);
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
    color: #1F2430;
    border-radius: 10px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    animation: pop-in 0.18s ease both;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid #E6E8EE;
    flex-shrink: 0;
  }
  .modal-header h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .modal-close {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #5A6272;
    font-size: 1.15rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .modal-close:hover { background: #F0F1F5; color: #1F2430; }

  .modal-body {
    padding: 18px;
    overflow-y: auto;
  }
  .modal-body video, .modal-body img {
    display: block;
    width: 100%;
    border-radius: 6px;
    background: #000;
  }
  .modal-body video { max-height: 42vh; }
  .modal-body img { max-height: 34vh; object-fit: cover; }

  .media-label {
    margin: 0 0 6px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #7A8296;
  }
  .media-block + .media-block { margin-top: 16px; }

  .modal-caption {
    margin: 16px 4px 4px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: #3A4152;
    text-align: center;
  }
  .modal-credit {
    margin: 8px 4px 0;
    font-size: 0.72rem;
    color: #8A92A6;
    text-align: center;
  }
</style>
</head>
<body>

  <h1 class="page-title">The Sun Introduces Itself — DEMO cơ chế ô vuông</h1>

  <div class="square-hint-top">Click here</div>
  <button id="square-btn" type="button" class="square-btn" aria-haspopup="dialog">Ô vuông<br />TEST</button>
  <div class="square-hint-bottom">for more<br />information!</div>

  <!-- ===== Cửa sổ nhỏ chứa ảnh + video ngẫu nhiên ===== -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">NASA Random Data 🚀</h2>
        <button id="modal-close" type="button" class="modal-close" aria-label="Đóng cửa sổ">✕</button>
      </div>
      <div class="modal-body">
        <div class="media-block">
          <p class="media-label">Video ngẫu nhiên</p>
          <div id="modal-video-box"></div>
        </div>
        <div class="media-block">
          <p class="media-label">Ảnh ngẫu nhiên</p>
          <img id="modal-img" src="" alt="Ảnh ngẫu nhiên từ NASA" />
        </div>
        <p class="modal-caption" id="modal-caption"></p>
        <p class="modal-credit" id="modal-credit"></p>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ===== Kho media — mỗi lần mở cửa sổ sẽ bốc thăm lại ===== */
  var VIDEOS = [
    {
      url: "https://images-assets.nasa.gov/video/JPL-20210419-TECHf-0001-First%20Video%20of%20NASA%E2%80%99s%20Ingenuity%20Mars%20Helicopter%20in%20Flight/JPL-20210419-TECHf-0001-First%20Video%20of%20NASA%E2%80%99s%20Ingenuity%20Mars%20Helicopter%20in%20Flight~mobile.mp4",
      caption: "Video đầu tiên về chuyến bay của trực thăng Ingenuity trên Sao Hỏa (19/04/2021).",
      credit: "Video: NASA/JPL-Caltech (public domain)."
    },
    {
      url: "https://images-assets.nasa.gov/video/KSC-19940705-MH-NAS01-0001-Apollo_11_25th_Historical_Footage_and_Broll-B_0905/KSC-19940705-MH-NAS01-0001-Apollo_11_25th_Historical_Footage_and_Broll-B_0905~mobile.mp4",
      caption: "Tư liệu lịch sử kỷ niệm 25 năm sứ mệnh Apollo 11 (1969).",
      credit: "Video: NASA KSC (public domain)."
    }
  ];

  var IMAGES = [
    {
      url: "https://images-assets.nasa.gov/image/as11-40-5948/as11-40-5948~large.jpg",
      caption: "Gương phản xạ laser LRRR của Apollo 11 tại Biển Tĩnh Lặng, 20/07/1969.",
      credit: "Ảnh: NASA / NSSDCA Photo ID AS11-40-5948."
    },
    {
      url: "https://images-assets.nasa.gov/image/PIA24665/PIA24665~medium.jpg",
      caption: "Trực thăng Ingenuity nhìn từ tàu Perseverance trên Sao Hỏa.",
      credit: "Ảnh: NASA/JPL-Caltech/ASU (PIA24665)."
    },
    {
      url: "https://images-assets.nasa.gov/image/PIA25970/PIA25970~small.jpg",
      caption: "Dấu vết các chuyến bay của Ingenuity in trên bụi Sao Hỏa.",
      credit: "Ảnh: NASA/JPL-Caltech (PIA25970)."
    },
    {
      url: "https://images-assets.nasa.gov/image/PIA24978/PIA24978~medium.jpg",
      caption: "Ingenuity đứng giữa bình nguyên bụi đỏ của miệng hố Jezero.",
      credit: "Ảnh: NASA/JPL-Caltech (PIA24978)."
    }
  ];

  var overlay = document.getElementById("modal-overlay");
  var videoBox = document.getElementById("modal-video-box");
  var imgEl = document.getElementById("modal-img");
  var captionEl = document.getElementById("modal-caption");
  var creditEl = document.getElementById("modal-credit");
  var lastV = -1, lastI = -1;

  function pickRandom(len, last) {
    /* bốc thăm lại nếu trùng đúng mục lần mở trước — để lần nào cũng thấy "đổi" */
    var idx = Math.floor(Math.random() * len);
    if (len > 1 && idx === last) idx = (idx + 1) % len;
    return idx;
  }

  function openModal() {
    var vi = pickRandom(VIDEOS.length, lastV);
    var ii = pickRandom(IMAGES.length, lastI);
    lastV = vi; lastI = ii;

    var vid = VIDEOS[vi];
    var img = IMAGES[ii];

    videoBox.innerHTML =
      '<video controls autoplay muted playsinline>' +
      '<source src="' + vid.url + '" type="video/mp4">Trình duyệt không phát được video.</video>';
    imgEl.src = img.url;
    captionEl.textContent = vid.caption + " — " + img.caption;
    creditEl.textContent = vid.credit + " " + img.credit;

    overlay.hidden = false;
    document.getElementById("modal-close").focus();
  }

  function closeModal() {
    overlay.hidden = true;
    videoBox.innerHTML = ""; /* dừng video hẳn khi đóng */
    imgEl.src = "";
  }

  document.getElementById("square-btn").addEventListener("click", openModal);
  document.getElementById("modal-close").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !overlay.hidden) closeModal();
  });
})();
</script>
</body>
</html>
